name: Update geosite

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-geosite.yml'

permissions:
  contents: write

concurrency:
  group: update-geosite
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v6

      - name: Download sources and compiler
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch master \
            https://github.com/v2fly/domain-list-community.git "$RUNNER_TEMP/community"
          git clone --depth 1 --branch master \
            https://github.com/hydraponique/roscomvpn-geosite.git "$RUNNER_TEMP/roscomvpn"

      - uses: actions/setup-go@v6
        with:
          go-version-file: ${{ runner.temp }}/community/go.mod
          cache: false

      - name: Assemble domain lists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/merged" data release licenses
          cp -a "$RUNNER_TEMP/roscomvpn/data/." "$RUNNER_TEMP/merged/"
          cp "$RUNNER_TEMP/community/data/category-ip-geo-detect" "$RUNNER_TEMP/merged/"
          python3 - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          merged = root / 'merged'
          queue = list(merged.iterdir())
          visited = set()
          while queue:
              path = queue.pop()
              if path.name in visited:
                  continue
              visited.add(path.name)
              for line in path.read_text(encoding='utf-8').splitlines():
                  match = re.match(r'\s*include:([^\s#]+)', line)
                  if not match:
                      continue
                  name = match.group(1)
                  if name in ('.', '..') or '/' in name or '\\' in name:
                      raise ValueError(f'Invalid include: {name}')
                  dependency = merged / name
                  if not dependency.exists():
                      shutil.copyfile(root / 'community' / 'data' / name, dependency)
                  queue.append(dependency)
          PY
          rsync -a --delete "$RUNNER_TEMP/merged/" data/
          cp "$RUNNER_TEMP/community/LICENSE" licenses/v2fly-domain-list-community.txt
          cp "$RUNNER_TEMP/roscomvpn/LICENSE" licenses/roscomvpn-geosite.txt

      - name: Build geosite.dat
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/community"
          go run ./ \
            -datapath="$GITHUB_WORKSPACE/data" \
            -outputdir="$GITHUB_WORKSPACE/release" \
            -outputname=geosite.dat
          test -s "$GITHUB_WORKSPACE/release/geosite.dat"
          cd "$GITHUB_WORKSPACE/release"
          sha256sum geosite.dat > geosite.dat.sha256

      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ licenses/ release/geosite.dat release/geosite.dat.sha256
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'Update domain lists and geosite.dat'
          git push
